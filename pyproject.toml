[project]
name = "insurance_claims_ai"
version = "0.1.0"
description = "insurance_claims_ai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,tools]>=1.15.23,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "85cea919-7315-4954-8d5c-9cb668a99123"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
